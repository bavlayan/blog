server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Statik site: her yol bir dizin, bulunamayanlar 404 sayfasına
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;

  # Parmak izli varlıklar uzun süre önbelleğe alınabilir
  location ~* \.(css|js)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/rss+xml image/svg+xml;

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'";
}
